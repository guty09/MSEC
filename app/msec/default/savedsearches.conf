
[MSEC - Discord DNS Correlation Case Study]
alert.track = 0
description = November 7, 2026 investigation correlating Suricata Discord DNS alerts with Sysmon network events for source ports 60776 and 60924. Identifies Discord.exe with a 3.016-second timestamp gap. Uses fixed connection filters for this case.
dispatch.earliest_time = 1794088800
dispatch.latest_time = 1794089400
display.general.type = statistics
display.page.search.tab = statistics
display.visualizations.show = 0
request.ui_dispatch_app = msec
request.ui_dispatch_view = search
search = (index=suricata sourcetype="suricata:json" event_type=alert src_ip="192.168.95.155" dest_ip="192.168.1.254" dest_port=53 (src_port=60776 OR src_port=60924))\
OR\
(index=sysmon SysmonEventID=3 SourceIp="192.168.95.155" DestinationIp="192.168.1.254" DestinationPort=53 (SourcePort=60776 OR SourcePort=60924))\
| eval Sensor=if(index=="suricata","Suricata","Sysmon")\
| eval SourcePort=coalesce(src_port,SourcePort)\
| rename "alert.signature" AS Signature\
| stats count AS Events values(Image) AS Process values(Signature) AS Signatures dc(Sensor) AS SensorCount earliest(_time) AS FirstSeen latest(_time) AS LastSeen by SourcePort\
| where SensorCount=2\
| eval TimeGapSeconds=round(LastSeen-FirstSeen,3)\
| table SourcePort Process Signatures Events SensorCount TimeGapSeconds

[MSEC - OneStart Execution After Removal]
alert.digest_mode = 0
alert.suppress = 1
