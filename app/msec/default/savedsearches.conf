alert.suppress.period = 60m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Detects Sysmon process creation from the OneStart.ai directory on monitored endpoints. Runs every five minutes and searches the previous ten minutes for possible recurrence after removal.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
quantity = 0
relation = greater than
request.ui_dispatch_app = msec
request.ui_dispatch_view = search
search = index=sysmon SysmonEventID=1 earliest=-10m latest=now\
Image="*\\OneStart.ai\\*"\
| stats count AS Executions latest(_time) AS LastSeen values(Image) AS Processes by host\
| convert ctime(LastSeen)

[MSEC - PowerShell Connection Corroborated by Firepower]
alert.digest_mode = 0
alert.severity = 1
alert.suppress = 1
alert.suppress.fields = Endpoint
alert.suppress.period = 60m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Identifies PowerShell TCP connections corroborated by Firepower using matching IPs, ports, and protocol within ten seconds. Provides process and endpoint context for investigation. A match alone does not establish malicious activity.
dispatch.earliest_time = -10m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 0
quantity = 0
relation = greater than
request.ui_dispatch_app = msec
request.ui_dispatch_view = search
search = (index=firewall sourcetype="cisco:ftd" "%FTD-6-302013")\
OR (index=sysmon SysmonEventID=3\
    (Image="*\\powershell.exe" OR Image="*\\pwsh.exe"))\
| rex field=_raw "for inside:(?<FTDSourceIP>[\d.]+)/(?<FTDSourcePort>\d+)"\
| rex field=_raw "to outside:(?<FTDDestinationIP>[\d.]+)/(?<FTDDestinationPort>\d+)"\
| eval Sensor=if(index=="firewall","Firepower","Sysmon"),\
       Endpoint=if(index=="sysmon",host,null())\
| eval SourceIP=coalesce(FTDSourceIP,SourceIp),\
       SourcePort=coalesce(FTDSourcePort,SourcePort),\
       DestinationIP=coalesce(FTDDestinationIP,DestinationIp),\
       DestinationPort=coalesce(FTDDestinationPort,DestinationPort),\
       Transport=if(index=="firewall","tcp",lower(Protocol))\
| where Transport="tcp"\
    AND isnotnull(SourceIP) AND isnotnull(SourcePort)\
    AND isnotnull(DestinationIP) AND isnotnull(DestinationPort)\
| sort 0 - _time\
| transaction SourceIP SourcePort DestinationIP DestinationPort Transport maxspan=10s\
| eval SensorCount=mvcount(mvdedup(Sensor))\
| where SensorCount=2\
| rename Image AS Process duration AS TimeSpanSeconds\
| table _time Endpoint SourceIP SourcePort DestinationIP DestinationPort Process ProcessGuid Sensor TimeSpanSeconds
[MSEC - Network Port Scan Detection]
description = Detects network service discovery using Suricata flow telemetry. MITRE ATT&CK T1046
search = index=suricata earliest=-10m event_type=flow\
| bin _time span=5m\
| stats dc(dest_port) AS unique_ports\
        count AS flow_events\
        by _time src_ip dest_ip\
| where unique_ports >= 100\
| sort -unique_ports
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m
dispatch.latest_time = now
enableSched = 0
alert.track = 1
counttype = number of events
quantity = 0
relation = greater than
alert.suppress = 0