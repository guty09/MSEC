[XmlWinEventLog:Microsoft-Windows-Sysmon/Operational]
EXTRACT-msec_sysmon_eventid = <EventID>(?<SysmonEventID>\d+)</EventID>
EXTRACT-msec_sysmon_image = <Data Name='Image'>(?<Image>[^<]*)</Data>
EXTRACT-msec_sysmon_commandline = <Data Name='CommandLine'>(?<CommandLine>[^<]*)</Data>
EXTRACT-msec_sysmon_sourceip = <Data Name='SourceIp'>(?<SourceIp>[^<]*)</Data>
EXTRACT-msec_sysmon_sourceport = <Data Name='SourcePort'>(?<SourcePort>[^<]*)</Data>
EXTRACT-msec_sysmon_destinationip = <Data Name='DestinationIp'>(?<DestinationIp>[^<]*)</Data>
EXTRACT-msec_sysmon_destinationport = <Data Name='DestinationPort'>(?<DestinationPort>[^<]*)</Data>

EXTRACT-msec_sysmon_protocol = <Data Name='Protocol'>(?<Protocol>[^<]*)</Data>
EXTRACT-msec_sysmon_processguid = <Data Name='ProcessGuid'>(?<ProcessGuid>[^<]*)</Data>
[cisco:ftd]
EXTRACT-msec_ftd_connection = for \S+:(?<SrcIP>\d{1,3}(?:\.\d{1,3}){3})/(?<SrcPort>\d+)(?:\s+\([^)]*\))?\s+to\s+\S+:(?<DstIP>\d{1,3}(?:\.\d{1,3}){3})/(?<DstPort>\d+)

EXTRACT-msec_ftd_icmp = %FTD-\d+-(?:302020|302021):.*?faddr\s+(?<SrcIP>[0-9A-Fa-f:.]+)/(?<ICMP_ID>\d+)\s+gaddr\s+(?<DstIP>[0-9A-Fa-f:.]+)/\d+\s+laddr\s+[0-9A-Fa-f:.]+/\d+\s+type\s+(?<ICMP_Type>\d+)\s+code\s+(?<ICMP_Code>\d+)
EXTRACT-msec_ftd_nat = %FTD-\d+-(?:305011|305012):\s+(?<NATAction>Built|Teardown)\s+\S+\s+(?<NATProtocol>TCP|UDP|ICMP)\s+translation\s+from\s+\S+:(?<NATOriginalIP>\d{1,3}(?:\.\d{1,3}){3})/(?<NATOriginalPort>\d+)\s+to\s+\S+:(?<NATTranslatedIP>\d{1,3}(?:\.\d{1,3}){3})/(?<NATTranslatedPort>\d+)

REPORT-cisco_ftd_report = cisco_ftd_kv_transformation
